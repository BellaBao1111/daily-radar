name: radar

on:
  schedule:
    # Five chances a day (UTC). Each run starts after a random delay of up to
    # 50 minutes and may randomly skip itself, so commit times and counts vary.
    # The two evening slots stop skipping if nothing was collected that day,
    # so every day gets at least one commit.
    - cron: "17 15 * * *"   # ~07:17 Pacific (standard time)
    - cron: "41 18 * * *"   # ~10:41
    - cron: "23 21 * * *"   # ~13:23
    - cron: "52 0 * * *"    # ~16:52
    - cron: "8 4 * * *"     # ~20:08
  workflow_dispatch:
    inputs:
      force:
        description: "Run now: no random skip, no delay"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Random delay
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 3000))

      - name: Collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Commits must be authored with an email linked to the account to
          # show up on the contribution graph.
          GIT_AUTHOR_NAME: ${{ vars.COMMIT_NAME || github.repository_owner }}
          GIT_AUTHOR_EMAIL: ${{ vars.COMMIT_EMAIL || format('{0}+{1}@users.noreply.github.com', github.repository_owner_id, github.repository_owner) }}
          GIT_COMMITTER_NAME: ${{ vars.COMMIT_NAME || github.repository_owner }}
          GIT_COMMITTER_EMAIL: ${{ vars.COMMIT_EMAIL || format('{0}+{1}@users.noreply.github.com', github.repository_owner_id, github.repository_owner) }}
        run: python3 radar.py ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}

      - name: Push
        run: |
          git pull --rebase --quiet
          git push
