name: radar

on:
  schedule:
    # Three chances a day (UTC). Each run may randomly skip itself, and starts
    # after a random delay, so commit times and counts vary from day to day.
    - cron: "17 15 * * *"   # ~07:17 Pacific
    - cron: "43 20 * * *"   # ~12:43 Pacific
    - cron: "8 3 * * *"     # ~19:08 Pacific
  workflow_dispatch:
    inputs:
      force:
        description: "Run now: no random skip, no delay"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Random delay
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 1500))

      - name: Collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Commits must be authored with an email linked to the account to
          # show up on the contribution graph.
          GIT_AUTHOR_NAME: ${{ vars.COMMIT_NAME || github.repository_owner }}
          GIT_AUTHOR_EMAIL: ${{ vars.COMMIT_EMAIL || format('{0}+{1}@users.noreply.github.com', github.repository_owner_id, github.repository_owner) }}
          GIT_COMMITTER_NAME: ${{ vars.COMMIT_NAME || github.repository_owner }}
          GIT_COMMITTER_EMAIL: ${{ vars.COMMIT_EMAIL || format('{0}+{1}@users.noreply.github.com', github.repository_owner_id, github.repository_owner) }}
        run: python3 radar.py ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}

      - name: Push
        run: |
          git pull --rebase --quiet
          git push
